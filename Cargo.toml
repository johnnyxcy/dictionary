[package]
name = "dictionary"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
description = "JDict, a native English–Chinese learning dictionary with local history"
license = "MIT"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit"]

[dependencies]
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6"
fs2 = "0.4"
gpui-kit = { version = "=0.7.2", optional = true }
iana-time-zone = "0.1"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "jdict"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 1
