name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Validate release version and native build tools
        run: |
          python3 scripts/release.py --check-only --tag "$RELEASE_TAG"
          xcodebuild -version
          xcrun --sdk macosx --find metal

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('rust-toolchain.toml', '.github/workflows/release.yml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('rust-toolchain.toml', '.github/workflows/release.yml') }}-

      - name: Check formatting and lint all targets
        run: ./.githooks/pre-commit

      - name: Run tests without model requests
        run: cargo test --locked --no-default-features

      - name: Build and verify release archive
        id: package
        run: python3 scripts/release.py --tag "$RELEASE_TAG"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jdict-macos-arm64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jdict-macos-arm64
          path: release

      - name: Verify archive checksum
        working-directory: release
        run: sha256sum --check --strict -- *.sha256

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease_args=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Apple Silicon (arm64), macOS 15 or later. Extract the ZIP and move JDict.app to Applications.

          Requires an installed, authenticated Codex CLI and your dictionary skill. This build is ad-hoc signed, without Developer ID signing or Apple notarization.

          A SHA-256 checksum is included alongside the ZIP.
          EOF
          gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 \
            --verify-tag --title "JDict $RELEASE_TAG" \
            --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${prerelease_args[@]}"
